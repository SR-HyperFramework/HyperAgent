<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="vi-VN" data-pptx-page-role="content" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background & Blueprint Grid -->
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B1220" />
  <path id="page-grid" data-pptx-role="decoration" d="M80 0V720 M160 0V720 M240 0V720 M320 0V720 M400 0V720 M480 0V720 M560 0V720 M640 0V720 M720 0V720 M800 0V720 M880 0V720 M960 0V720 M1040 0V720 M1120 0V720 M1200 0V720 M0 80H1280 M0 160H1280 M0 240H1280 M0 320H1280 M0 400H1280 M0 480H1280 M0 560H1280 M0 640H1280" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />

  <!-- Running Header -->
  <g id="page-header" data-pptx-role="header" data-pptx-bounds="60 40 1160 26" font-family="Consolas" font-size="12" fill="#8FA0B8">
    <text x="60" y="58" letter-spacing="3">01 · PROBLEM STATEMENT &amp; MOTIVATION</text>
    <text x="1220" y="58" text-anchor="end" letter-spacing="2">02 / 12</text>
  </g>

  <!-- Slide Title -->
  <g id="p2-title" data-pptx-bounds="60 84 1160 80">
    <text x="60" y="122" font-size="34" font-weight="bold" fill="#E6EDF7">
      Ba Nút Thắt Chí Tử Trong Phân Tích Mã Độc
    </text>
    <text x="60" y="154" font-size="16" fill="#8FA0B8">
      Thực trạng phân tích tệp thực thi PE và lý do các giải pháp hiện hữu không đáp ứng môi trường bảo mật cao
    </text>
  </g>

  <!-- 3 Blueprint Cards Grid -->
  <g id="p2-cards" data-pptx-bounds="60 185 1160 360">
    <!-- Card 1: Tool Fragmentation (Amber) -->
    <rect x="60" y="185" width="365" height="360" rx="8" fill="#111C30" stroke="#243350" stroke-width="1" />
    <rect x="60" y="185" width="6" height="360" rx="3" fill="#F59E0B" />

    <text x="85" y="218" font-family="Consolas" font-size="11" font-weight="bold" fill="#F59E0B" letter-spacing="2">01 · FRAGMENTATION</text>
    <text x="85" y="250" font-size="20" font-weight="bold" fill="#E6EDF7">
      Quy Trình Thủ Công
      <tspan x="85" dy="28">&amp; Phụ Thuộc Con Người</tspan>
    </text>

    <line x1="85" y1="295" x2="395" y2="295" stroke="#243350" stroke-width="1" />

    <text x="85" y="325" font-size="14" font-weight="600" fill="#E6EDF7">
      Luân chuyển nhiều công cụ rời rạc:
    </text>
    <text x="85" y="348" font-size="13" fill="#C7D2E3">
      Chuyên viên phải mở cùng lúc IDA Pro,
      <tspan x="85" dy="20">x64dbg, sandbox và VirusTotal. Tốn nhiều</tspan>
      <tspan x="85" dy="20">giờ thao tác chuyển giao dữ kiện thủ công.</tspan>
    </text>

    <text x="85" y="425" font-size="14" font-weight="600" fill="#E6EDF7">
      Khó chuẩn hóa chất lượng báo cáo:
    </text>
    <text x="85" y="448" font-size="13" fill="#C7D2E3">
      Kết quả điều tra phụ thuộc vào trực giác
      <tspan x="85" dy="20">cá nhân; thiếu tính kế thừa và khó đào tạo</tspan>
      <tspan x="85" dy="20">chuyển giao quy chuẩn trong đội ngũ SOC.</tspan>
    </text>

    <!-- Card 2: Commercial Sandbox (Red) -->
    <rect x="458" y="185" width="365" height="360" rx="8" fill="#111C30" stroke="#243350" stroke-width="1" />
    <rect x="458" y="185" width="6" height="360" rx="3" fill="#EF4444" />

    <text x="483" y="218" font-family="Consolas" font-size="11" font-weight="bold" fill="#EF4444" letter-spacing="2">02 · SECURITY RISK</text>
    <text x="483" y="250" font-size="20" font-weight="bold" fill="#E6EDF7">
      Rủi Ro Sandbox Đóng
      <tspan x="483" dy="28">&amp; Nguy Cơ Lộ Lọt Dữ Liệu</tspan>
    </text>

    <line x1="483" y1="295" x2="793" y2="295" stroke="#243350" stroke-width="1" />

    <text x="483" y="325" font-size="14" font-weight="600" fill="#E6EDF7">
      Bắt buộc gửi mẫu ra ngoài Cloud:
    </text>
    <text x="483" y="348" font-size="13" fill="#C7D2E3">
      Các giải pháp SaaS yêu cầu tải mẫu lên
      <tspan x="483" dy="20">server nước ngoài, vi phạm nghiêm ngặt</tspan>
      <tspan x="483" dy="20">chính sách an toàn thông tin nội bộ.</tspan>
    </text>

    <text x="483" y="425" font-size="14" font-weight="600" fill="#E6EDF7">
      Mô hình hộp đen thiếu khả năng can thiệp:
    </text>
    <text x="483" y="448" font-size="13" fill="#C7D2E3">
      Không thể tùy chỉnh luồng gỡ lỗi sâu,
      <tspan x="483" dy="20">không thể đặt breakpoint tại điểm OEP</tspan>
      <tspan x="483" dy="20">để bóc tách các lớp payload mã hóa.</tspan>
    </text>

    <!-- Card 3: AI Hallucination & Prompt Injection (Violet) -->
    <rect x="855" y="185" width="365" height="360" rx="8" fill="#111C30" stroke="#243350" stroke-width="1" />
    <rect x="855" y="185" width="6" height="360" rx="3" fill="#A78BFA" />

    <text x="880" y="218" font-family="Consolas" font-size="11" font-weight="bold" fill="#A78BFA" letter-spacing="2">03 · AI BLACK-BOX</text>
    <text x="880" y="250" font-size="20" font-weight="bold" fill="#E6EDF7">
      Bẫy "Ảo Giác" Của AI
      <tspan x="880" dy="28">&amp; Tấn Công Prompt Injection</tspan>
    </text>

    <line x1="880" y1="295" x2="1190" y2="295" stroke="#243350" stroke-width="1" />

    <text x="880" y="325" font-size="14" font-weight="600" fill="#E6EDF7">
      Nhận định không có bằng chứng:
    </text>
    <text x="880" y="348" font-size="13" fill="#C7D2E3">
      Giao trực tiếp việc phân loại nhị phân cho
      <tspan x="880" dy="20">LLM dễ dẫn tới ảo giác nguy hiểm khi</tspan>
      <tspan x="880" dy="20">mô hình tự suy đoán hành vi không có thực.</tspan>
    </text>

    <text x="880" y="425" font-size="14" font-weight="600" fill="#E6EDF7">
      Hiểm họa Prompt Injection từ mẫu PE:
    </text>
    <text x="880" y="448" font-size="13" fill="#C7D2E3">
      Mã độc gài sẵn chuỗi chỉ thị vào thân tệp
      <tspan x="880" dy="20">để "đánh lừa" mô hình nếu hệ thống</tspan>
      <tspan x="880" dy="20">coi dữ liệu trích xuất như lệnh điều khiển.</tspan>
    </text>
  </g>

  <!-- Bottom Blueprint Spine Banner -->
  <g id="p2-requirement" data-pptx-bounds="60 565 1160 85">
    <rect x="60" y="565" width="1160" height="85" rx="8" fill="#0F2A44" stroke="#38BDF8" stroke-width="1.5" filter="url(#glowCyan)" />
    <text x="90" y="595" font-family="Consolas" font-size="12" font-weight="bold" fill="#38BDF8" letter-spacing="2">ENGINEERING REQUIREMENT:</text>
    <text x="90" y="622" font-size="15" font-weight="bold" fill="#E6EDF7">
      Cần một hệ thống tự động hóa điều phối quy trình phân tích Hybrid Tĩnh - Động, trong đó AI đóng vai trò Agent
      <tspan x="90" dy="20" font-weight="normal" fill="#C7D2E3">chọn công cụ và suy luận có căn cứ, vận hành 100% On-Premise trên máy trạm nội bộ cô lập.</tspan>
    </text>
  </g>
</svg>
