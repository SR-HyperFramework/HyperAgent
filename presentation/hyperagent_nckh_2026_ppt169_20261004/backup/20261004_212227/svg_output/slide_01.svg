<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="vi-VN" data-pptx-page-role="cover">
  <defs>
    <clipPath id="portraitClip">
      <rect x="105" y="465" width="90" height="120" rx="8" ry="8"/>
    </clipPath>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect id="page-bg" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background"/>

  <!-- Top Accent Bar -->
  <rect id="top-accent-bar" x="0" y="0" width="1280" height="6" fill="url(#blueGrad)" data-pptx-role="decoration"/>

  <!-- Top Institution Header -->
  <g id="header-group" data-pptx-bounds="80 45 1120 53">
    <!-- HCMUTE Logo -->
    <image href="images/hcmute_logo.png" x="80" y="45" width="260" height="53"/>
    
    <!-- Conference Badge -->
    <rect x="880" y="45" width="320" height="38" rx="19" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <circle cx="902" cy="64" r="5" fill="#2563EB"/>
    <text x="918" y="69" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E40AF" letter-spacing="0.5">NCKH SINH VIÊN NĂM 2026</text>
  </g>

  <!-- Title & Subject Hero Section -->
  <g id="title-hero" data-pptx-bounds="80 145 1120 220">
    <!-- Category Pill -->
    <rect x="80" y="145" width="220" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="95" y="164" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569" letter-spacing="1">BÁO CÁO NGHIÊN CỨU KHOA HỌC</text>

    <!-- Main Title -->
    <text x="80" y="222" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#0F172A">
      XÂY DỰNG CÔNG CỤ PHÂN TÍCH MÃ ĐỘC HYBRID
    </text>
    <text x="80" y="272" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#2563EB">
      (KẾT HỢP TĨNH VÀ ĐỘNG) CÓ SỬ DỤNG AI
    </text>

    <!-- Project Subtitle / Identity -->
    <text x="80" y="325" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">
      HyperAgent: Hệ thống điều phối 9 giai đoạn tự động, hợp nhất IDA Pro &amp; x64dbg qua MCP,
      <tspan x="80" dy="26">ràng buộc phán quyết theo bằng chứng và vận hành an toàn trong hạ tầng nội bộ.</tspan>
    </text>
  </g>

  <!-- Divider Line -->
  <line id="section-divider" x1="80" y1="410" x2="1200" y2="410" stroke="#E2E8F0" stroke-width="1.5" data-pptx-role="decoration"/>

  <!-- Info Cards Section -->
  <g id="info-section" data-pptx-bounds="80 440 1120 210">
    <!-- Main Student & Author Card -->
    <rect x="80" y="440" width="580" height="210" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Author Portrait with ClipPath -->
    <image href="images/author_portrait.jpeg" x="105" y="465" width="90" height="120" clip-path="url(#portraitClip)" preserveAspectRatio="xMidYMid slice"/>

    <!-- Author Details -->
    <text x="215" y="485" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="0.5">SINH VIÊN THỰC HIỆN CHÍNH</text>
    <text x="215" y="512" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Nguyễn Hoàng Gia Huy</text>
    <text x="215" y="534" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">
      MSSV: 24162046 • Ngày sinh: 16/09/2006
      <tspan x="215" dy="21">Email: 24162046@student.hcmute.edu.vn</tspan>
    </text>

    <!-- Team Members -->
    <text x="215" y="595" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">THÀNH VIÊN ĐỀ TÀI:</text>
    <text x="215" y="618" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#334155">Trần Đình Đan Trường  •  Lý Văn Hữu Hoà  •  Nguyễn Đăng Khoa</text>

    <!-- Advisor & Institution Card -->
    <rect x="680" y="440" width="520" height="210" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <text x="715" y="485" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D9488" letter-spacing="0.5">GIẢNG VIÊN HƯỚNG DẪN</text>
    <text x="715" y="515" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">ThS. Nguyễn Thị Thanh Vân</text>
    <text x="715" y="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#64748B">Khoa Công nghệ Thông tin</text>

    <!-- Details Box inside Advisor Card -->
    <rect x="715" y="565" width="450" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="735" y="590" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Đơn vị tổ chức:</text>
    <text x="835" y="590" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#475569">Đại học Công nghệ Kỹ thuật TP.HCM (HCMUTE)</text>
    <text x="735" y="612" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Thời gian thực hiện:</text>
    <text x="865" y="612" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#475569">Niên khóa 2025 – 2026</text>
  </g>
</svg>
