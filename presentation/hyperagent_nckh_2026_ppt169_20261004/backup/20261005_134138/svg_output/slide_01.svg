<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="vi-VN" data-pptx-page-role="cover" font-family="Consolas">
  <defs>
    <radialGradient id="coverGlow" cx="0.75" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0" />
    </radialGradient>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.5" />
    </filter>
    <filter id="glowViolet" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#A78BFA" flood-opacity="0.45" />
    </filter>
    <clipPath id="portraitClip">
      <rect x="790" y="215" width="80" height="100" rx="6" ry="6" />
    </clipPath>
  </defs>

  <!-- Background & Blueprint Grid -->
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B1220" />
  <path id="page-grid" data-pptx-role="decoration" d="M80 0V720 M160 0V720 M240 0V720 M320 0V720 M400 0V720 M480 0V720 M560 0V720 M640 0V720 M720 0V720 M800 0V720 M880 0V720 M960 0V720 M1040 0V720 M1120 0V720 M1200 0V720 M0 80H1280 M0 160H1280 M0 240H1280 M0 320H1280 M0 400H1280 M0 480H1280 M0 560H1280 M0 640H1280" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
  <rect id="cover-glow" data-pptx-role="decoration" x="0" y="0" width="1280" height="720" fill="url(#coverGlow)" />

  <!-- Top Blueprint Kicker -->
  <g id="cover-kicker" data-pptx-bounds="80 50 1120 40">
    <line x1="80" y1="65" x2="120" y2="65" stroke="#38BDF8" stroke-width="2" />
    <text x="132" y="70" font-size="12" letter-spacing="3" fill="#8FA0B8">HỘI NGHỊ NCKH SINH VIÊN 2026 · HCMUTE · AN TOÀN THÔNG TIN</text>
    <text x="1200" y="70" text-anchor="end" font-size="12" letter-spacing="2" fill="#38BDF8">BLUEPRINT ARCHITECTURE</text>
  </g>

  <!-- Left Main Title Hero Block -->
  <g id="cover-title" data-pptx-bounds="80 130 650 480">
    <!-- Tech Badge -->
    <rect x="80" y="130" width="180" height="26" rx="4" fill="#0F2A44" stroke="#38BDF8" stroke-width="1" />
    <text x="92" y="147" font-size="11" font-weight="bold" fill="#38BDF8" letter-spacing="1">HYBRID MALWARE ANALYSIS</text>

    <!-- Main Headings -->
    <text x="80" y="215" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="bold" fill="#E6EDF7" filter="url(#glowCyan)">HyperAgent</text>
    
    <text x="80" y="270" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#E6EDF7">
      Phân Tích Mã Độc Hybrid
      <tspan x="80" dy="38" fill="#38BDF8">(Kết Hợp Tĩnh &amp; Động) Có Sử Dụng AI</tspan>
    </text>

    <!-- Technical Cyan Divider Line -->
    <line x1="80" y1="335" x2="420" y2="335" stroke="#38BDF8" stroke-width="2" />

    <!-- Subtitle / Architecture Description -->
    <text x="80" y="375" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#C7D2E3">
      Hệ thống điều phối 9 giai đoạn tự động, kết nối IDA Pro &amp; x64dbg qua MCP,
      <tspan x="80" dy="26">ràng buộc phán quyết theo bằng chứng và vận hành an toàn trong hạ tầng nội bộ.</tspan>
    </text>

    <!-- Key Spec Tags Row -->
    <rect x="80" y="445" width="150" height="32" rx="4" fill="#111C30" stroke="#243350" stroke-width="1" />
    <text x="92" y="466" font-size="12" fill="#34D399">F1-SCORE 91.9%</text>

    <rect x="245" y="445" width="170" height="32" rx="4" fill="#111C30" stroke="#243350" stroke-width="1" />
    <text x="257" y="466" font-size="12" fill="#38BDF8">PRECISION 98.5%</text>

    <rect x="430" y="445" width="190" height="32" rx="4" fill="#111C30" stroke="#243350" stroke-width="1" />
    <text x="442" y="466" font-size="12" fill="#A78BFA">3,000 PE SAMPLES</text>
  </g>

  <!-- Right Blueprint Schematics & Authors Card -->
  <g id="cover-author-blueprint" data-pptx-bounds="750 130 450 490">
    <!-- Outer Card Frame -->
    <rect x="750" y="130" width="450" height="490" rx="10" fill="#111C30" stroke="#243350" stroke-width="1.5" />
    <rect x="750" y="130" width="6" height="490" rx="3" fill="#38BDF8" />

    <!-- Card Top Header -->
    <rect x="775" y="155" width="400" height="38" rx="6" fill="#0F2A44" stroke="#38BDF8" stroke-width="1" />
    <text x="790" y="179" font-size="12" font-weight="bold" fill="#38BDF8" letter-spacing="2">PROJECT SPECIFICATION SHEET</text>
    <text x="1155" y="179" text-anchor="end" font-size="11" fill="#8FA0B8">2026.10</text>

    <!-- Author Portrait & Lead Student Info -->
    <image href="images/author_portrait.jpeg" x="790" y="215" width="80" height="100" clip-path="url(#portraitClip)" preserveAspectRatio="xMidYMid slice" />
    
    <text x="890" y="235" font-size="11" font-weight="bold" fill="#38BDF8" letter-spacing="1">LEAD RESEARCHER</text>
    <text x="890" y="260" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#E6EDF7">Nguyễn Hoàng Gia Huy</text>
    <text x="890" y="282" font-size="12" fill="#8FA0B8">
      MSSV: 24162046 • B.2006
      <tspan x="890" dy="20">24162046@student.hcmute.edu.vn</tspan>
    </text>

    <line x1="775" y1="335" x2="1175" y2="335" stroke="#243350" stroke-width="1" />

    <!-- Team Members -->
    <text x="775" y="362" font-size="11" font-weight="bold" fill="#A78BFA" letter-spacing="1">PROJECT MEMBERS</text>
    <text x="775" y="388" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#C7D2E3">
      Trần Đình Đan Trường  •  Lý Văn Hữu Hoà  •  Nguyễn Đăng Khoa
    </text>

    <line x1="775" y1="415" x2="1175" y2="415" stroke="#243350" stroke-width="1" />

    <!-- Scientific Advisor -->
    <text x="775" y="442" font-size="11" font-weight="bold" fill="#34D399" letter-spacing="1">SCIENTIFIC ADVISOR</text>
    <text x="775" y="468" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#E6EDF7">ThS. Nguyễn Thị Thanh Vân</text>
    <text x="775" y="490" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8FA0B8">Khoa Công nghệ Thông tin — HCMUTE</text>

    <line x1="775" y1="515" x2="1175" y2="515" stroke="#243350" stroke-width="1" />

    <!-- Host University Banner -->
    <image href="images/hcmute_logo.png" x="775" y="535" width="220" height="45" preserveAspectRatio="xMidYMid meet" />
    <text x="1175" y="562" text-anchor="end" font-size="11" fill="#8FA0B8">DEPT OF CS/IT</text>
  </g>

  <!-- Bottom Blueprint Footer Reference -->
  <g id="cover-source" data-pptx-bounds="80 650 1120 30">
    <line x1="80" y1="645" x2="1200" y2="645" stroke="#243350" stroke-width="1" />
    <text x="80" y="670" font-size="12" fill="#8FA0B8">MÃ NGUỒN VÀ DỮ LIỆU ĐỀ TÀI: github.com/SR-HyperFramework/HyperAgent · PHÂN TÍCH MÃ ĐỘC HỆ ĐIỀU HÀNH WINDOWS (PE)</text>
  </g>
</svg>
