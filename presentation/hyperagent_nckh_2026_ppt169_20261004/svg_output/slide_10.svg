<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="vi-VN" data-pptx-page-role="content" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background & Blueprint Grid -->
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B1220" />
  <path id="page-grid" data-pptx-role="decoration" d="M80 0V720 M160 0V720 M240 0V720 M320 0V720 M400 0V720 M480 0V720 M560 0V720 M640 0V720 M720 0V720 M800 0V720 M880 0V720 M960 0V720 M1040 0V720 M1120 0V720 M1200 0V720 M0 80H1280 M0 160H1280 M0 240H1280 M0 320H1280 M0 400H1280 M0 480H1280 M0 560H1280 M0 640H1280" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />

  <!-- Running Header -->
  <g id="page-header" data-pptx-role="header" data-pptx-bounds="60 40 1160 26" font-family="Consolas" font-size="12" fill="#8FA0B8">
    <text x="60" y="58" letter-spacing="3">09 · PRACTICAL CONTRIBUTIONS &amp; IMPACT</text>
    <text x="1220" y="58" text-anchor="end" letter-spacing="2">10 / 12</text>
  </g>

  <!-- Slide Title -->
  <g id="p10-title" data-pptx-bounds="60 84 1160 80">
    <text x="60" y="122" font-size="34" font-weight="bold" fill="#E6EDF7">
      Đóng Góp Về Giáo Dục, An Ninh Mạng &amp; Khả Năng Áp Dụng
    </text>
    <text x="60" y="154" font-size="16" fill="#8FA0B8">
      Ý nghĩa khoa học và giá trị thiết thực đối với Đào tạo đại học, Trung tâm SOC/CSIRT và triển khai doanh nghiệp
    </text>
  </g>

  <!-- 3 Impact Pillars Section -->
  <g id="p10-pillars" data-pptx-bounds="60 185 1160 495">
    <!-- Pillar 1: Education & Training (Cyan) -->
    <rect x="60" y="185" width="365" height="495" rx="8" fill="#111C30" stroke="#243350" stroke-width="1" />
    <rect x="60" y="185" width="6" height="495" rx="3" fill="#38BDF8" />

    <rect x="85" y="210" width="145" height="24" rx="4" fill="#0F2A44" stroke="#38BDF8" stroke-width="1" />
    <text x="97" y="226" font-family="Consolas" font-size="11" font-weight="bold" fill="#38BDF8" letter-spacing="1">GIÁO DỤC &amp; ĐÀO TẠO</text>
    
    <text x="85" y="265" font-size="20" font-weight="bold" fill="#E6EDF7">
      Học Liệu Thực Hành Mở
      <tspan x="85" dy="28">Cho Sinh Viên An Toàn TT</tspan>
    </text>

    <!-- Point 1.1 -->
    <circle cx="95" cy="335" r="4" fill="#38BDF8" />
    <text x="110" y="339" font-size="13" font-weight="bold" fill="#E6EDF7">
      Mã nguồn &amp; lược đồ mở 100%:
      <tspan x="110" dy="20" font-size="12" font-weight="normal" fill="#C7D2E3">Toàn bộ kiến trúc, JSON Schema và nhật</tspan>
      <tspan x="110" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">ký phân tích được công khai, minh bạch</tspan>
      <tspan x="110" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">và dễ tiếp cận cho cộng đồng nghiên cứu.</tspan>
    </text>

    <!-- Point 1.2 -->
    <circle cx="95" cy="445" r="4" fill="#38BDF8" />
    <text x="110" y="449" font-size="13" font-weight="bold" fill="#E6EDF7">
      Tài liệu thực hành chuyên sâu:
      <tspan x="110" dy="20" font-size="12" font-weight="normal" fill="#C7D2E3">Các artifact JSON trung gian qua từng giai</tspan>
      <tspan x="110" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">đoạn là học liệu trực quan, giá trị cho sinh</tspan>
      <tspan x="110" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">viên môn Phân tích mã độc &amp; Dịch ngược.</tspan>
    </text>

    <!-- Point 1.3 -->
    <circle cx="95" cy="555" r="4" fill="#38BDF8" />
    <text x="110" y="559" font-size="13" font-weight="bold" fill="#E6EDF7">
      Tiếp cận công nghệ AI Agent mới:
      <tspan x="110" dy="20" font-size="12" font-weight="normal" fill="#C7D2E3">Giúp sinh viên HCMUTE tiếp cận sớm với</tspan>
      <tspan x="110" dy="18" font-size="12" fill="#38BDF8">giao thức Model Context Protocol (MCP)</tspan>
      <tspan x="110" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">và kỹ thuật Agentic AI tiên tiến.</tspan>
    </text>

    <!-- Pillar 2: Cybersecurity & Defense (Emerald) -->
    <rect x="458" y="185" width="365" height="495" rx="8" fill="#111C30" stroke="#243350" stroke-width="1" />
    <rect x="458" y="185" width="6" height="495" rx="3" fill="#34D399" />

    <rect x="483" y="210" width="155" height="24" rx="4" fill="#0D3326" stroke="#34D399" stroke-width="1" />
    <text x="495" y="226" font-family="Consolas" font-size="11" font-weight="bold" fill="#34D399" letter-spacing="1">AN NINH &amp; QUỐC PHÒNG</text>

    <text x="483" y="265" font-size="20" font-weight="bold" fill="#E6EDF7">
      Bảo Mật Nội Bộ Tuyệt Đối
      <tspan x="483" dy="28">&amp; Chuẩn Hóa Cho SOC</tspan>
    </text>

    <!-- Point 2.1 -->
    <circle cx="493" cy="335" r="4" fill="#34D399" />
    <text x="508" y="339" font-size="13" font-weight="bold" fill="#E6EDF7">
      Triển khai On-Premise 100%:
      <tspan x="508" dy="20" font-size="12" font-weight="normal" fill="#C7D2E3">Toàn bộ quá trình giải mã, gỡ lỗi và suy</tspan>
      <tspan x="508" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">luận chạy trong mạng nội bộ, tuyệt đối</tspan>
      <tspan x="508" dy="18" font-size="12" fill="#34D399">không gửi mẫu ra dịch vụ nước ngoài.</tspan>
    </text>

    <!-- Point 2.2 -->
    <circle cx="493" cy="445" r="4" fill="#34D399" />
    <text x="508" y="449" font-size="13" font-weight="bold" fill="#E6EDF7">
      Hỗ trợ trung tâm SOC &amp; CSIRT:
      <tspan x="508" dy="20" font-size="12" font-weight="normal" fill="#C7D2E3">Rút ngắn thời gian phân loại sơ bộ mẫu</tspan>
      <tspan x="508" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">nghi vấn từ nhiều ngày xuống dưới 90 phút,</tspan>
      <tspan x="508" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">giúp ứng cứu kịp thời trước mã độc mới.</tspan>
    </text>

    <!-- Point 2.3 -->
    <circle cx="493" cy="555" r="4" fill="#34D399" />
    <text x="508" y="559" font-size="13" font-weight="bold" fill="#E6EDF7">
      Chuẩn hóa chất lượng báo cáo:
      <tspan x="508" dy="20" font-size="12" font-weight="normal" fill="#C7D2E3">Báo cáo Markdown đồng nhất, trích xuất</tspan>
      <tspan x="508" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">đủ chuỗi IoC và hành vi có kiểm chứng,</tspan>
      <tspan x="508" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">phục vụ đắc lực cho điều tra số (Forensics).</tspan>
    </text>

    <!-- Pillar 3: Practical Feasibility (Violet) -->
    <rect x="855" y="185" width="365" height="495" rx="8" fill="#111C30" stroke="#243350" stroke-width="1" />
    <rect x="855" y="185" width="6" height="495" rx="3" fill="#A78BFA" />

    <rect x="880" y="210" width="135" height="24" rx="4" fill="#2E1B4E" stroke="#A78BFA" stroke-width="1" />
    <text x="892" y="226" font-family="Consolas" font-size="11" font-weight="bold" fill="#A78BFA" letter-spacing="1">ÁP DỤNG THỰC TẾ</text>

    <text x="880" y="265" font-size="20" font-weight="bold" fill="#E6EDF7">
      Chi Phí Đầu Tư Thấp
      <tspan x="880" dy="28">&amp; Khả Năng Tùy Biến</tspan>
    </text>

    <!-- Point 3.1 -->
    <circle cx="890" cy="335" r="4" fill="#A78BFA" />
    <text x="905" y="339" font-size="13" font-weight="bold" fill="#E6EDF7">
      Hạ tầng tối giản, dễ triển khai:
      <tspan x="905" dy="20" font-size="12" font-weight="normal" fill="#C7D2E3">Chỉ cần 01 máy trạm thông thường cài</tspan>
      <tspan x="905" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">đặt máy ảo VMware Workstation,</tspan>
      <tspan x="905" dy="18" font-size="12" fill="#A78BFA">không cần máy chủ tính toán chuyên dụng.</tspan>
    </text>

    <!-- Point 3.2 -->
    <circle cx="890" cy="445" r="4" fill="#A78BFA" />
    <text x="905" y="449" font-size="13" font-weight="bold" fill="#E6EDF7">
      Định vị phân khúc tối ưu:
      <tspan x="905" dy="20" font-size="12" font-weight="normal" fill="#C7D2E3">Phù hợp hoàn hảo cho phân tích chuyên</tspan>
      <tspan x="905" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">sâu các mẫu nguy hiểm đã được sàng lọc,</tspan>
      <tspan x="905" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">thay vì quét khối lượng lớn.</tspan>
    </text>

    <!-- Point 3.3 -->
    <circle cx="890" cy="555" r="4" fill="#A78BFA" />
    <text x="905" y="559" font-size="13" font-weight="bold" fill="#E6EDF7">
      Kiến trúc module linh hoạt:
      <tspan x="905" dy="20" font-size="12" font-weight="normal" fill="#C7D2E3">Chuẩn MCP cho phép dễ dàng cắm rút</tspan>
      <tspan x="905" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">và tích hợp thêm các công cụ phân tích</tspan>
      <tspan x="905" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">mới như Ghidra hay Volatility.</tspan>
    </text>
  </g>
</svg>
