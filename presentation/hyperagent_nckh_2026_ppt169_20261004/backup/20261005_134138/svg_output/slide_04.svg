<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="vi-VN" data-pptx-page-role="content" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background & Blueprint Grid -->
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B1220" />
  <path id="page-grid" data-pptx-role="decoration" d="M80 0V720 M160 0V720 M240 0V720 M320 0V720 M400 0V720 M480 0V720 M560 0V720 M640 0V720 M720 0V720 M800 0V720 M880 0V720 M960 0V720 M1040 0V720 M1120 0V720 M1200 0V720 M0 80H1280 M0 160H1280 M0 240H1280 M0 320H1280 M0 400H1280 M0 480H1280 M0 560H1280 M0 640H1280" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />

  <!-- Running Header -->
  <g id="page-header" data-pptx-role="header" data-pptx-bounds="60 40 1160 26" font-family="Consolas" font-size="12" fill="#8FA0B8">
    <text x="60" y="58" letter-spacing="3">03 · SCIENTIFIC NOVELTY &amp; CONTRIBUTIONS</text>
    <text x="1220" y="58" text-anchor="end" letter-spacing="2">04 / 12</text>
  </g>

  <!-- Slide Title -->
  <g id="p4-title" data-pptx-bounds="60 84 1160 80">
    <text x="60" y="122" font-size="34" font-weight="bold" fill="#E6EDF7">
      Ba Điểm Mới Cốt Lõi Của Đề Tài HyperAgent
    </text>
    <text x="60" y="154" font-size="16" fill="#8FA0B8">
      Những đóng góp khoa học và kỹ thuật khác biệt so với các công trình nghiên cứu hiện nay
    </text>
  </g>

  <!-- 3 Novelty Blueprint Cards Grid -->
  <g id="p4-cards" data-pptx-bounds="60 185 1160 495">
    <!-- Card 1: Process-level Fusion (Cyan) -->
    <rect x="60" y="185" width="365" height="495" rx="8" fill="#111C30" stroke="#243350" stroke-width="1" />
    <rect x="60" y="185" width="6" height="495" rx="3" fill="#38BDF8" />

    <rect x="85" y="210" width="105" height="24" rx="4" fill="#0F2A44" stroke="#38BDF8" stroke-width="1" />
    <text x="97" y="226" font-family="Consolas" font-size="11" font-weight="bold" fill="#38BDF8" letter-spacing="1">ĐIỂM MỚI 01</text>
    
    <text x="85" y="265" font-size="20" font-weight="bold" fill="#E6EDF7">
      Hợp Nhất Tĩnh - Động
      <tspan x="85" dy="28">Ở Mức Quy Trình</tspan>
    </text>
    <text x="85" y="325" font-family="Consolas" font-size="11" font-weight="bold" fill="#38BDF8" letter-spacing="1">
      PROCESS-LEVEL FUSION
    </text>

    <!-- Contrast Box -->
    <rect x="85" y="345" width="315" height="65" rx="6" fill="#16233B" stroke="#243350" stroke-width="1" />
    <text x="98" y="366" font-family="Consolas" font-size="11" font-weight="bold" fill="#8FA0B8">NGHIÊN CỨU HIỆN TẠI:</text>
    <text x="98" y="386" font-size="11" fill="#8FA0B8">
      Chỉ ghép đặc trưng hoặc bỏ phiếu đầu ra
      <tspan x="98" dy="16">của mô hình phân loại nhị phân.</tspan>
    </text>

    <!-- Novelty Points -->
    <circle cx="95" cy="440" r="4" fill="#38BDF8" />
    <text x="110" y="444" font-size="13" font-weight="bold" fill="#E6EDF7">
      Chu trình 9 giai đoạn thích ứng:
      <tspan x="110" dy="20" font-size="12" font-weight="normal" fill="#C7D2E3">Quy trình thông minh theo vòng lặp:</tspan>
      <tspan x="110" dy="18" font-family="Consolas" font-size="12" fill="#38BDF8">Tĩnh 1 → Giải nén → Tĩnh 2 → Động.</tspan>
      <tspan x="110" dy="20" font-size="12" font-weight="normal" fill="#C7D2E3">Kết quả của giai đoạn trước quyết định</tspan>
      <tspan x="110" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">trực tiếp mục tiêu và hành vi giai đoạn sau.</tspan>
    </text>

    <circle cx="95" cy="565" r="4" fill="#38BDF8" />
    <text x="110" y="569" font-size="13" font-weight="bold" fill="#E6EDF7">
      Tái phân tích sau giải nén:
      <tspan x="110" dy="20" font-size="12" font-weight="normal" fill="#C7D2E3">Lượt tĩnh thứ 2 trên payload đã bung nén</tspan>
      <tspan x="110" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">giúp bóc trần toàn bộ API và chuỗi bị giấu.</tspan>
    </text>

    <!-- Card 2: Evidence-bound Verdict (Emerald) -->
    <rect x="458" y="185" width="365" height="495" rx="8" fill="#111C30" stroke="#243350" stroke-width="1" />
    <rect x="458" y="185" width="6" height="495" rx="3" fill="#34D399" />

    <rect x="483" y="210" width="105" height="24" rx="4" fill="#0D3326" stroke="#34D399" stroke-width="1" />
    <text x="495" y="226" font-family="Consolas" font-size="11" font-weight="bold" fill="#34D399" letter-spacing="1">ĐIỂM MỚI 02</text>

    <text x="483" y="265" font-size="20" font-weight="bold" fill="#E6EDF7">
      Ràng Buộc Kết Luận
      <tspan x="483" dy="28">Theo Bằng Chứng</tspan>
    </text>
    <text x="483" y="325" font-family="Consolas" font-size="11" font-weight="bold" fill="#34D399" letter-spacing="1">
      EVIDENCE-BOUND VERDICT
    </text>

    <!-- Contrast Box -->
    <rect x="483" y="345" width="315" height="65" rx="6" fill="#16233B" stroke="#243350" stroke-width="1" />
    <text x="496" y="366" font-family="Consolas" font-size="11" font-weight="bold" fill="#8FA0B8">NGHIÊN CỨU HIỆN TẠI:</text>
    <text x="496" y="386" font-size="11" fill="#8FA0B8">
      LLM tự do sinh nhận định dễ gặp ảo giác
      <tspan x="496" dy="16">hoặc bị gài bẫy prompt injection.</tspan>
    </text>

    <!-- Novelty Points -->
    <circle cx="493" cy="440" r="4" fill="#34D399" />
    <text x="508" y="444" font-size="13" font-weight="bold" fill="#E6EDF7">
      Bộ lọc phân loại 3 trạng thái:
      <tspan x="508" dy="20" font-size="12" font-weight="normal" fill="#C7D2E3">Giai đoạn đối chiếu phân loại khẳng định</tspan>
      <tspan x="508" dy="18" font-size="12" fill="#34D399">thành: Được phép, Kèm điều kiện hoặc</tspan>
      <tspan x="508" dy="18" font-size="12" fill="#34D399">Bị cấm trước khi được ghi vào báo cáo.</tspan>
    </text>

    <circle cx="493" cy="565" r="4" fill="#34D399" />
    <text x="508" y="569" font-size="13" font-weight="bold" fill="#E6EDF7">
      Phòng vệ tiêm nhiễm lệnh:
      <tspan x="508" dy="20" font-size="12" font-weight="normal" fill="#C7D2E3">Dữ liệu trích từ mẫu chỉ được xem là dữ</tspan>
      <tspan x="508" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">liệu thô (Untrusted Data), không thể biến</tspan>
      <tspan x="508" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">thành chỉ thị điều khiển mô hình LLM.</tspan>
    </text>

    <!-- Card 3: Ablation Evaluation (Violet) -->
    <rect x="855" y="185" width="365" height="495" rx="8" fill="#111C30" stroke="#243350" stroke-width="1" />
    <rect x="855" y="185" width="6" height="495" rx="3" fill="#A78BFA" />

    <rect x="880" y="210" width="105" height="24" rx="4" fill="#2E1B4E" stroke="#A78BFA" stroke-width="1" />
    <text x="892" y="226" font-family="Consolas" font-size="11" font-weight="bold" fill="#A78BFA" letter-spacing="1">ĐIỂM MỚI 03</text>

    <text x="880" y="265" font-size="20" font-weight="bold" fill="#E6EDF7">
      Khung Đánh Giá Loại Trừ
      <tspan x="880" dy="28">Có Đối Chứng</tspan>
    </text>
    <text x="880" y="325" font-family="Consolas" font-size="11" font-weight="bold" fill="#A78BFA" letter-spacing="1">
      ABLATION EVALUATION
    </text>

    <!-- Contrast Box -->
    <rect x="880" y="345" width="315" height="65" rx="6" fill="#16233B" stroke="#243350" stroke-width="1" />
    <text x="893" y="366" font-family="Consolas" font-size="11" font-weight="bold" fill="#8FA0B8">NGHIÊN CỨU HIỆN TẠI:</text>
    <text x="893" y="386" font-size="11" fill="#8FA0B8">
      Hiếm khi đo lường đóng góp độc lập
      <tspan x="893" dy="16">của từng nguồn bằng chứng trên Agent.</tspan>
    </text>

    <!-- Novelty Points -->
    <circle cx="890" cy="440" r="4" fill="#A78BFA" />
    <text x="905" y="444" font-size="13" font-weight="bold" fill="#E6EDF7">
      Thực nghiệm 3.000 mẫu quy chuẩn:
      <tspan x="905" dy="20" font-size="12" font-weight="normal" fill="#C7D2E3">Kiểm định đối chứng chặt chẽ giữa 3 cấu</tspan>
      <tspan x="905" dy="18" font-size="12" fill="#A78BFA">hình: FULL (đầy đủ), A1 (bỏ tĩnh) và</tspan>
      <tspan x="905" dy="18" font-size="12" fill="#A78BFA">A2 (bỏ động) trên tập DikeDataset.</tspan>
    </text>

    <circle cx="890" cy="565" r="4" fill="#A78BFA" />
    <text x="905" y="569" font-size="13" font-weight="bold" fill="#E6EDF7">
      Chứng minh định lượng:
      <tspan x="905" dy="20" font-size="12" font-weight="normal" fill="#C7D2E3">Xác định chính xác trọng số đóng góp</tspan>
      <tspan x="905" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">của từng nguồn bằng chứng và hiệu quả</tspan>
      <tspan x="905" dy="18" font-size="12" font-weight="normal" fill="#C7D2E3">thực tế của pha tĩnh lần 2 sau giải nén.</tspan>
    </text>
  </g>
</svg>
