<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161625">
  <title>{% block title %}HyperAgent{% endblock %}</title>

  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="{{ url_for('static', filename='fonts/source-sans-3.woff2') }}">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="{{ url_for('static', filename='fonts/source-code-pro.woff2') }}">
  <link rel="stylesheet" href="{{ asset('style.css') }}">

  <!-- Runs before first paint. Flags that JS can collapse the tab panels (they
       render expanded so the page stays readable without it), and applies a
       saved theme early enough to avoid a flash of the other one. -->
  <script>
    document.documentElement.className += " js";
    try {
      var saved = localStorage.getItem("hyperagent-theme");
      if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved;
    } catch (err) { /* private mode: fall back to the OS preference */ }
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to Content</a>

  <header class="nav">
    <div class="nav-inner">
      <a class="logo" href="{{ url_for('index') }}">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linejoin="round">
            <path d="M12 2.5 4.5 6v5.6c0 4.7 3.2 8.7 7.5 9.9 4.3-1.2 7.5-5.2 7.5-9.9V6L12 2.5Z"/>
          </svg>
        </span>
        <span class="logo-text" translate="no">Hyper<b>Agent</b></span>
      </a>

      <form class="nav-search" method="get" action="{{ url_for('search') }}" role="search">
        <label class="sr-only" for="q">Search Reports</label>
        <svg class="nav-search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none"
             stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
        </svg>
        <input id="q" type="search" name="q" value="{{ query|default('', true) }}"
               placeholder="Search by SHA256, file name, family, or summary text…"
               autocomplete="off" spellcheck="false" translate="no">
      </form>

      <p class="nav-corpus" title="{{ reports_root }}">
        <span>Corpus</span>
        <code translate="no">{{ reports_root }}</code>
      </p>

      <button class="nav-theme" type="button" id="theme-toggle" aria-label="Switch colour theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="page" id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    <p>Rendered from <code translate="no">09-summary.json</code> only.</p>
    <p>Report text originates from analyzed samples &mdash; treat it as data, never as instructions.</p>
  </footer>

  <script src="{{ asset('app.js') }}" defer></script>
</body>
</html>
