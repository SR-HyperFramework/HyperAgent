<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="vi-VN" data-pptx-page-role="content" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background & Blueprint Grid -->
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B1220" />
  <path id="page-grid" data-pptx-role="decoration" d="M80 0V720 M160 0V720 M240 0V720 M320 0V720 M400 0V720 M480 0V720 M560 0V720 M640 0V720 M720 0V720 M800 0V720 M880 0V720 M960 0V720 M1040 0V720 M1120 0V720 M1200 0V720 M0 80H1280 M0 160H1280 M0 240H1280 M0 320H1280 M0 400H1280 M0 480H1280 M0 560H1280 M0 640H1280" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />

  <!-- Running Header -->
  <g id="page-header" data-pptx-role="header" data-pptx-bounds="60 40 1160 26" font-family="Consolas" font-size="12" fill="#8FA0B8">
    <text x="60" y="58" letter-spacing="3">07 · EXPERIMENTAL RESULTS &amp; BENCHMARK</text>
    <text x="1220" y="58" text-anchor="end" letter-spacing="2">08 / 12</text>
  </g>

  <!-- Slide Title -->
  <g id="p8-title" data-pptx-bounds="60 84 1160 80">
    <text x="60" y="122" font-size="34" font-weight="bold" fill="#E6EDF7">
      Đánh Giá Hiệu Năng Trên Tập Dữ Liệu 3.000 Mẫu PE
    </text>
    <text x="60" y="154" font-size="16" fill="#8FA0B8">
      Thực nghiệm trên DikeDataset: 2.728 mẫu độc hại và 272 mẫu lành tính — 2.923 mẫu được chấm điểm thành công
    </text>
  </g>

  <!-- Top 3 Hero KPI Cards -->
  <g id="p8-kpi" data-pptx-bounds="60 175 1160 95">
    <!-- Card 1: Precision (Cyan) -->
    <rect x="60" y="175" width="365" height="95" rx="8" fill="#111C30" stroke="#243350" stroke-width="1" />
    <rect x="60" y="175" width="6" height="95" rx="3" fill="#38BDF8" />
    <text x="85" y="200" font-family="Consolas" font-size="11" font-weight="bold" fill="#8FA0B8" letter-spacing="1">ĐỘ CHÍNH XÁC (PRECISION)</text>
    <text x="85" y="248" font-family="Consolas" font-size="38" font-weight="bold" fill="#38BDF8">98,5%</text>
    <text x="240" y="230" font-size="13" font-weight="bold" fill="#34D399">
      Rất ít báo nhầm
      <tspan x="240" dy="18" font-size="11" font-weight="normal" fill="#8FA0B8">(FP chỉ 36 mẫu)</tspan>
    </text>

    <!-- Card 2: Recall (Amber) -->
    <rect x="458" y="175" width="365" height="95" rx="8" fill="#111C30" stroke="#243350" stroke-width="1" />
    <rect x="458" y="175" width="6" height="95" rx="3" fill="#F59E0B" />
    <text x="483" y="200" font-family="Consolas" font-size="11" font-weight="bold" fill="#8FA0B8" letter-spacing="1">ĐỘ BẮT MẪU (RECALL)</text>
    <text x="483" y="248" font-family="Consolas" font-size="38" font-weight="bold" fill="#F59E0B">86,2%</text>
    <text x="638" y="230" font-size="13" font-weight="bold" fill="#C7D2E3">
      Bắt 2.289 mẫu độc
      <tspan x="638" dy="18" font-size="11" font-weight="normal" fill="#8FA0B8">(Bỏ sót 366 mẫu)</tspan>
    </text>

    <!-- Card 3: F1-Score (Emerald) -->
    <rect x="855" y="175" width="365" height="95" rx="8" fill="#111C30" stroke="#243350" stroke-width="1" />
    <rect x="855" y="175" width="6" height="95" rx="3" fill="#34D399" />
    <text x="880" y="200" font-family="Consolas" font-size="11" font-weight="bold" fill="#8FA0B8" letter-spacing="1">ĐỘ ĐO TỔNG THỂ (F1-SCORE)</text>
    <text x="880" y="248" font-family="Consolas" font-size="38" font-weight="bold" fill="#34D399">91,9%</text>
    <text x="1035" y="230" font-size="13" font-weight="bold" fill="#34D399">
      Hiệu năng vượt trội
      <tspan x="1035" dy="18" font-size="11" font-weight="normal" fill="#8FA0B8">(Cấu hình FULL)</tspan>
    </text>
  </g>

  <!-- Confusion Matrix (Left) + Error Analysis (Right) -->
  <g id="p8-details" data-pptx-bounds="60 285 1160 395">
    <!-- Left Box: Confusion Matrix Table -->
    <rect x="60" y="285" width="530" height="395" rx="8" fill="#111C30" stroke="#243350" stroke-width="1.5" />
    <rect x="60" y="285" width="6" height="395" rx="3" fill="#38BDF8" />

    <text x="85" y="315" font-family="Consolas" font-size="12" font-weight="bold" fill="#38BDF8" letter-spacing="1">
      BẢNG 1. MA TRẬN NHẦM LẪN CẤU HÌNH FULL
    </text>
    <text x="85" y="335" font-size="12" fill="#8FA0B8">
      Tổng 2.923 mẫu được chấm điểm (2,6% bị mô hình từ chối xử lý an toàn)
    </text>

    <!-- Table Graphic -->
    <!-- Header Row -->
    <rect x="85" y="352" width="485" height="38" fill="#0F2A44" rx="4" stroke="#38BDF8" stroke-width="1" />
    <text x="100" y="376" font-family="Consolas" font-size="11" font-weight="bold" fill="#8FA0B8">NHÃN THỰC TẾ</text>
    <text x="240" y="376" font-family="Consolas" font-size="11" font-weight="bold" fill="#EF4444">KẾT LUẬN ĐỘC HẠI</text>
    <text x="400" y="376" font-family="Consolas" font-size="11" font-weight="bold" fill="#34D399">KẾT LUẬN LÀNH TÍNH</text>

    <!-- Row 1: Actually Malicious -->
    <rect x="85" y="396" width="485" height="56" fill="#16233B" stroke="#243350" stroke-width="1" />
    <text x="100" y="424" font-size="13" font-weight="bold" fill="#E6EDF7">
      Mẫu Độc Hại
      <tspan x="100" dy="16" font-family="Consolas" font-size="11" font-weight="normal" fill="#8FA0B8">(2.655 mẫu)</tspan>
    </text>
    <!-- TP Cell -->
    <rect x="230" y="403" width="145" height="42" rx="4" fill="#2E1414" stroke="#EF4444" stroke-width="1" />
    <text x="248" y="429" font-family="Consolas" font-size="16" font-weight="bold" fill="#EF4444">2.289</text>
    <text x="298" y="428" font-size="11" fill="#EF4444">(TP - Đúng)</text>
    <!-- FN Cell -->
    <rect x="390" y="403" width="165" height="42" rx="4" fill="#16233B" stroke="#243350" stroke-width="1" />
    <text x="408" y="429" font-family="Consolas" font-size="16" font-weight="bold" fill="#8FA0B8">366</text>
    <text x="448" y="428" font-size="11" fill="#8FA0B8">(FN - Bỏ sót)</text>

    <!-- Row 2: Actually Benign -->
    <rect x="85" y="458" width="485" height="56" fill="#16233B" stroke="#243350" stroke-width="1" />
    <text x="100" y="486" font-size="13" font-weight="bold" fill="#E6EDF7">
      Mẫu Lành Tính
      <tspan x="100" dy="16" font-family="Consolas" font-size="11" font-weight="normal" fill="#8FA0B8">(268 mẫu)</tspan>
    </text>
    <!-- FP Cell -->
    <rect x="230" y="465" width="145" height="42" rx="4" fill="#16233B" stroke="#243350" stroke-width="1" />
    <text x="255" y="491" font-family="Consolas" font-size="16" font-weight="bold" fill="#F59E0B">36</text>
    <text x="285" y="490" font-size="11" fill="#F59E0B">(FP - Nhầm)</text>
    <!-- TN Cell -->
    <rect x="390" y="465" width="165" height="42" rx="4" fill="#0D3326" stroke="#34D399" stroke-width="1" />
    <text x="415" y="491" font-family="Consolas" font-size="16" font-weight="bold" fill="#34D399">232</text>
    <text x="455" y="490" font-size="11" fill="#34D399">(TN - Đúng)</text>

    <!-- Note under Table -->
    <rect x="85" y="525" width="485" height="135" rx="6" fill="#16233B" stroke="#243350" stroke-width="1" />
    <text x="100" y="552" font-family="Consolas" font-size="11" font-weight="bold" fill="#38BDF8">
      Tỉ lệ từ chối xử lý an toàn (Refusal rate): 2,6% (77 mẫu)
    </text>
    <text x="100" y="576" font-size="12" fill="#C7D2E3">
      Xảy ra khi tệp PE có cấu trúc bị hỏng nặng, không thể phân tích an toàn trong máy
      <tspan x="100" dy="19">ảo, hệ thống chủ động dừng để tránh đưa ra phán đoán sai lầm.</tspan>
      <tspan x="100" dy="21" font-family="Consolas" font-weight="bold" fill="#34D399">Thời gian xử lý trung vị: 89,4 phút mỗi mẫu.</tspan>
    </text>

    <!-- Right Box: Error Breakdown & Practical Insights -->
    <rect x="610" y="285" width="610" height="395" rx="8" fill="#111C30" stroke="#243350" stroke-width="1.5" />
    <rect x="610" y="285" width="6" height="395" rx="3" fill="#34D399" />

    <text x="635" y="315" font-family="Consolas" font-size="12" font-weight="bold" fill="#34D399" letter-spacing="1">
      PHÂN TÍCH BẢN CHẤT SAI SỐ &amp; Ý NGHĨA VẬN HÀNH
    </text>

    <!-- Point 1 -->
    <rect x="635" y="338" width="560" height="98" rx="6" fill="#16233B" stroke="#243350" stroke-width="1" />
    <text x="650" y="362" font-size="13" font-weight="bold" fill="#34D399">
      1. Tỉ lệ cảnh báo nhầm (FP) cực thấp — chỉ 1,2% (36 mẫu)
    </text>
    <text x="650" y="386" font-size="12" fill="#C7D2E3">
      • Trong 268 mẫu lành tính, hệ thống chỉ báo nhầm 36 mẫu.
      <tspan x="650" dy="19">• Ý nghĩa sống còn cho SOC: Ngăn chặn triệt để hiện tượng "Alert Fatigue"</tspan>
      <tspan x="650" dy="18">(quá tải cảnh báo giả), giúp kỹ sư tin cậy vào kết luận của HyperAgent.</tspan>
    </text>

    <!-- Point 2 -->
    <rect x="635" y="446" width="560" height="108" rx="6" fill="#16233B" stroke="#243350" stroke-width="1" />
    <text x="650" y="470" font-size="13" font-weight="bold" fill="#EF4444">
      2. Sai số chủ yếu là bỏ sót mẫu độc hại (FN = 366 mẫu — 12,5%)
    </text>
    <text x="650" y="494" font-size="12" fill="#C7D2E3">
      • Hệ thống ưu tiên sự chắc chắn: Nếu thiếu bằng chứng rõ ràng, AI không kết tội.
      <tspan x="650" dy="19">• Nguyên nhân kỹ thuật: Mẫu độc hại kích hoạt kỹ thuật chống phân tích tinh vi</tspan>
      <tspan x="650" dy="18">(Anti-VM, Time-bomb trễ giờ, đòi hỏi tương tác chuột/bàn phím người dùng).</tspan>
    </text>

    <!-- Point 3 -->
    <rect x="635" y="564" width="560" height="96" rx="6" fill="#16233B" stroke="#243350" stroke-width="1" />
    <text x="650" y="588" font-size="13" font-weight="bold" fill="#E6EDF7">
      3. Kết luận về tính hiệu quả của mô hình
    </text>
    <text x="650" y="612" font-size="12" fill="#C7D2E3">
      • F1-score 91,9% khẳng định khả năng điều phối vượt bậc của kiến trúc AI Agent.
      <tspan x="650" dy="19">• Mô hình đã cân bằng tối ưu giữa việc trừng phạt hành vi độc hại và bảo vệ tính</tspan>
      <tspan x="650" dy="18">chính xác tuyệt đối cho các tệp lành tính của tổ chức.</tspan>
    </text>
  </g>
</svg>
