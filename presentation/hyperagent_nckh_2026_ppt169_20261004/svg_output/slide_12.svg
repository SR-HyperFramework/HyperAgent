<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="vi-VN" data-pptx-page-role="ending" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
