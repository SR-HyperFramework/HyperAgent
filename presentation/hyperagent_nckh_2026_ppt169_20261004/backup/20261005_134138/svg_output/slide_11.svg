<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="vi-VN" data-pptx-page-role="content" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background & Blueprint Grid -->
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B1220" />
  <path id="page-grid" data-pptx-role="decoration" d="M80 0V720 M160 0V720 M240 0V720 M320 0V720 M400 0V720 M480 0V720 M560 0V720 M640 0V720 M720 0V720 M800 0V720 M880 0V720 M960 0V720 M1040 0V720 M1120 0V720 M1200 0V720 M0 80H1280 M0 160H1280 M0 240H1280 M0 320H1280 M0 400H1280 M0 480H1280 M0 560H1280 M0 640H1280" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />

  <!-- Running Header -->
  <g id="page-header" data-pptx-role="header" data-pptx-bounds="60 40 1160 26" font-family="Consolas" font-size="12" fill="#8FA0B8">
    <text x="60" y="58" letter-spacing="3">10 · CONCLUSION &amp; FUTURE ROADMAP</text>
    <text x="1220" y="58" text-anchor="end" letter-spacing="2">11 / 12</text>
  </g>

  <!-- Slide Title -->
  <g id="p11-title" data-pptx-bounds="60 84 1160 80">
    <text x="60" y="122" font-size="34" font-weight="bold" fill="#E6EDF7">
      Kết Luận Đề Tài &amp; Định Hướng Phát Triển
    </text>
    <text x="60" y="154" font-size="16" fill="#8FA0B8">
      Tổng kết những dấu ấn đạt được, thẳng thắn nhìn nhận hạn chế và lộ trình công bố khoa học trong tương lai
    </text>
  </g>

  <!-- 2 Large Columns: Results Achieved (Left) vs Future Roadmap (Right) -->
  <g id="p11-content" data-pptx-bounds="60 185 1160 495">
    <!-- Left Column: Key Achievements (Emerald) -->
    <rect x="60" y="185" width="565" height="495" rx="8" fill="#111C30" stroke="#243350" stroke-width="1" />
    <rect x="60" y="185" width="6" height="495" rx="3" fill="#34D399" />

    <rect x="85" y="205" width="220" height="24" rx="4" fill="#0D3326" stroke="#34D399" stroke-width="1" />
    <text x="97" y="221" font-family="Consolas" font-size="11" font-weight="bold" fill="#34D399" letter-spacing="1">CÁC KẾT QUẢ ĐẠT ĐƯỢC</text>

    <!-- Item 1 -->
    <rect x="85" y="240" width="515" height="90" rx="6" fill="#16233B" stroke="#243350" stroke-width="1" />
    <circle cx="105" cy="262" r="3" fill="#34D399" />
    <text x="120" y="266" font-size="13" font-weight="bold" fill="#E6EDF7">
      1. Hiện thực hóa thành công công cụ HyperAgent:
    </text>
    <text x="120" y="289" font-size="12" fill="#C7D2E3">
      Xây dựng hệ thống 9 giai đoạn tự động hóa kết nối IDA Pro &amp; x64dbg qua MCP,
      <tspan x="120" dy="18">vận hành 100% On-Premise an toàn với máy ảo Windows cô lập.</tspan>
    </text>

    <!-- Item 2 -->
    <rect x="85" y="342" width="515" height="90" rx="6" fill="#16233B" stroke="#243350" stroke-width="1" />
    <circle cx="105" cy="364" r="3" fill="#34D399" />
    <text x="120" y="368" font-size="13" font-weight="bold" fill="#E6EDF7">
      2. Giải quyết triệt để ảo giác &amp; phòng vệ Injection:
    </text>
    <text x="120" y="391" font-size="12" fill="#C7D2E3">
      Đưa ra cơ chế phán quyết 3 trạng thái (Được phép, Có điều kiện, Bị cấm);
      <tspan x="120" dy="18">xem dữ liệu mẫu là Untrusted Data, đảm bảo kết luận luôn có minh chứng.</tspan>
    </text>

    <!-- Item 3 -->
    <rect x="85" y="444" width="515" height="95" rx="6" fill="#16233B" stroke="#243350" stroke-width="1" />
    <circle cx="105" cy="466" r="3" fill="#34D399" />
    <text x="120" y="470" font-size="13" font-weight="bold" fill="#E6EDF7">
      3. Thực nghiệm quy mô lớn 3.000 mẫu PE:
    </text>
    <text x="120" y="493" font-size="12" fill="#C7D2E3">
      Đạt Precision 98,5%, Recall 86,2%, F1 91,9%; chứng minh định lượng sự đóng góp
      <tspan x="120" dy="18">lớn hơn của động (-11,2%) và giá trị của tĩnh lần 2 sau giải nén (+5,7%).</tspan>
    </text>

    <!-- Item 4 -->
    <rect x="85" y="551" width="515" height="90" rx="6" fill="#16233B" stroke="#243350" stroke-width="1" />
    <circle cx="105" cy="573" r="3" fill="#34D399" />
    <text x="120" y="577" font-size="13" font-weight="bold" fill="#E6EDF7">
      4. Sản phẩm mở, sẵn sàng ứng dụng:
    </text>
    <text x="120" y="600" font-size="12" fill="#C7D2E3">
      Toàn bộ mã nguồn, cấu trúc Schema và dữ liệu mở hoàn toàn, đóng góp hữu ích
      <tspan x="120" dy="18">cho đào tạo đại học và hỗ trợ thực tế cho các trung tâm SOC/CSIRT.</tspan>
    </text>

    <!-- Right Column: Limitations & Future Roadmap (Cyan) -->
    <rect x="655" y="185" width="565" height="495" rx="8" fill="#111C30" stroke="#243350" stroke-width="1" />
    <rect x="655" y="185" width="6" height="495" rx="3" fill="#38BDF8" />

    <rect x="680" y="205" width="235" height="24" rx="4" fill="#0F2A44" stroke="#38BDF8" stroke-width="1" />
    <text x="692" y="221" font-family="Consolas" font-size="11" font-weight="bold" fill="#38BDF8" letter-spacing="1">HẠN CHẾ &amp; HƯỚNG PHÁT TRIỂN</text>

    <!-- Future Point 1 -->
    <rect x="680" y="240" width="515" height="118" rx="6" fill="#16233B" stroke="#243350" stroke-width="1" />
    <rect x="680" y="240" width="4" height="118" rx="2" fill="#F59E0B" />
    <text x="700" y="265" font-size="14" font-weight="bold" fill="#E6EDF7">
      1. Tối ưu hóa thời gian xử lý (Execution Time):
    </text>
    <text x="700" y="289" font-size="12" font-weight="bold" fill="#F59E0B">
      Hạn chế hiện tại: Thời gian trung vị 89,4 phút/mẫu còn tương đối cao.
    </text>
    <text x="700" y="312" font-size="12" fill="#C7D2E3">
      • Hướng giải quyết: Song song hóa các phép trích xuất tĩnh, tối ưu hóa quá trình
      <tspan x="700" dy="18">dò tìm điểm OEP trong x64dbg để rút ngắn thời gian xử lý xuống dưới 30 phút.</tspan>
    </text>

    <!-- Future Point 2 -->
    <rect x="680" y="372" width="515" height="118" rx="6" fill="#16233B" stroke="#243350" stroke-width="1" />
    <rect x="680" y="372" width="4" height="118" rx="2" fill="#38BDF8" />
    <text x="700" y="397" font-size="14" font-weight="bold" fill="#E6EDF7">
      2. Mở rộng đa nền tảng &amp; đa định dạng tệp:
    </text>
    <text x="700" y="421" font-size="12" font-weight="bold" fill="#38BDF8">
      Hạn chế hiện tại: Mới chỉ hỗ trợ tệp PE trên môi trường Windows.
    </text>
    <text x="700" y="444" font-size="12" fill="#C7D2E3">
      • Hướng phát triển: Tích hợp phân tích định dạng ELF (Linux/IoT)
      <tspan x="700" dy="18">và mã độc trên nền tảng di động Android (APK/DEX).</tspan>
    </text>

    <!-- Future Point 3 -->
    <rect x="680" y="504" width="515" height="128" rx="6" fill="#16233B" stroke="#243350" stroke-width="1" />
    <rect x="680" y="504" width="4" height="128" rx="2" fill="#A78BFA" />
    <text x="700" y="529" font-size="14" font-weight="bold" fill="#E6EDF7">
      3. Hoàn thiện công bố khoa học (Scientific Publication):
    </text>
    <text x="700" y="553" font-size="12" font-weight="bold" fill="#A78BFA">
      Kế hoạch: Chuẩn bị bài báo từ dữ liệu 3.000 mẫu thực nghiệm.
    </text>
    <text x="700" y="576" font-size="12" fill="#C7D2E3">
      • Mục tiêu: Hoàn thiện bản thảo về Agentic Malware Analysis
      <tspan x="700" dy="18">để gửi đăng tại các hội thảo và tạp chí uy tín về ATTT.</tspan>
    </text>
  </g>
</svg>
